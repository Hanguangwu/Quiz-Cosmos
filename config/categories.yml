# 分类注册表（Category Registry）
#
# 这是全站唯一的分类 / 子分类声明来源。
# - scripts/validate-content.ts 会校验每张卡的 category 与 subcategory 是否在此声明。
# - 目录约定：content/<category>/<subcategory>/<id>.md
# - 新增分类时：先改这里，再建 content 下的目录；顺序由 order 决定（小的在前）。
version: 1

categories:
  - id: ai
    label: 人工智能
    order: 1
    subcategories:
      llm: 大语言模型
  - id: programming
    label: 编程
    order: 2
    subcategories:
      os: 操作系统
      db: 数据库
      java: Java
  - id: history
    label: 历史
    order: 3
    subcategories: {}
  - id: philosophy
    label: 哲学
    order: 4
    subcategories: {}
  - id: other
    label: 其他
    order: 5
    subcategories: {}
